<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 俯視小車，前方(相機/箭頭)朝上 -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4bd06a"/>
      <stop offset="1" stop-color="#2f9d4e"/>
    </linearGradient>
  </defs>
  <!-- 四個輪子 -->
  <rect x="9"  y="22" width="12" height="24" rx="5" fill="#1c1c22"/>
  <rect x="79" y="22" width="12" height="24" rx="5" fill="#1c1c22"/>
  <rect x="9"  y="56" width="12" height="24" rx="5" fill="#1c1c22"/>
  <rect x="79" y="56" width="12" height="24" rx="5" fill="#1c1c22"/>
  <!-- 車身 -->
  <rect x="20" y="16" width="60" height="70" rx="16" fill="url(#body)" stroke="#176b30" stroke-width="3"/>
  <!-- 前方方向箭頭 -->
  <polygon points="50,4 41,17 59,17" fill="#ffd23f" stroke="#c79a16" stroke-width="1"/>
  <!-- D435 相機模組(前方) -->
  <rect x="27" y="22" width="46" height="15" rx="6" fill="#0e1d27"/>
  <circle cx="39" cy="29.5" r="4.2" fill="#39d0ff"/>
  <circle cx="61" cy="29.5" r="4.2" fill="#39d0ff"/>
  <circle cx="50" cy="29.5" r="2.2" fill="#ff5d5d"/>
  <!-- 上蓋細節 -->
  <rect x="33" y="46" width="34" height="26" rx="6" fill="#2b9048"/>
  <rect x="40" y="52" width="20" height="14" rx="3" fill="#247c3e"/>
</svg>
